# config.toml — настройки exch без секретов. Секреты (токен бота, пароль базы, ключи
# Telegram) — только в .env. Переменные окружения сильнее этого файла.
# Создаётся командой `exch setup`; менять можно в любой момент, затем перезапустить exch.

[owner]
# Часовой пояс для времени в пульте и у клиентов.
timezone = "Europe/Moscow"
# @username оператора для экрана «Поддержка» (пусто — клиент пишет вопрос прямо в бот).
support = ""

[log]
# text — понятные строки в окне программы (ноутбук), json — для сервера.
format = "text"
# info — обычный ход работы; debug — подробно (для разбора проблем).
level = "info"
# Журнал в файл — папка рядом с config.toml, файл на каждый день (exch.ГГГГ-ММ-ДД.log, день по
# UTC). Его можно прислать для разбора аварии. "off" — не писать в файл.
dir = "logs"
# Сколько дней хранить файлы журнала; старые удаляются сами.
keep_days = 14

[health]
# Адрес пинг-сервиса (например, healthchecks.io): бот пингует его раз в минуту, но только когда
# движок и опрос Telegram работают. Бот завис, упал или лежит база — пинги прекращаются, и сервис
# сам пишет вам (почта, Telegram). Необязательно, но без него о молчащем боте никто не узнает.
url = ""
