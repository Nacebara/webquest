<style>
:root{color-scheme:light dark;--ok:light-dark(#1f9d55,#3fca74);--wa:light-dark(#d98200,#f2a93b);--h:var(--tg-theme-hint-color,#8a96a3);--t:var(--tg-theme-secondary-bg-color,#eef1f4);--a:var(--tg-theme-button-color,#3390ec);--ln:light-dark(#e1e6eb,#2f3c49);--tx:var(--tg-theme-text-color,#000)}
body{margin:0;padding:10px 12px max(10px,var(--tg-content-safe-area-inset-bottom,0px));font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;gap:12px}
svg{flex:none;width:58px;height:58px}
circle{fill:none;stroke-width:4}
.k{stroke:var(--ln)}
#pv{stroke:var(--a);stroke-linecap:round;stroke-dasharray:131.9;transition:stroke-dashoffset 1s linear}
.late #pv{stroke:var(--wa)}
text{fill:var(--tx);font-size:11.5px;font-weight:600;text-anchor:middle}
.top b{display:block;font-size:1.08em}
.top span{font-size:.84em;color:var(--h)}
.late .top span{color:var(--wa)}
.fn{margin-top:10px;font-size:.86em}
.fn .b{height:4px;border-radius:2px;background:var(--ln);margin-top:5px}
.fn .b i{display:block;height:100%;border-radius:2px;background:var(--ok);transition:width .6s}
.cl{margin:10px 0 0;padding:7px 10px;border-radius:9px;background:var(--t);font-size:.84em}
.cl small{display:block;color:var(--h);font-size:.86em;margin-bottom:2px}
</style>
<div id=o><div class=top><svg viewBox="0 0 48 48"><circle class=k cx=24 cy=24 r=21 /><circle id=pv cx=24 cy=24 r=21 transform="rotate(-90 24 24)"/><text id=tm x=24 y=28></text></svg><div><b id=hd></b><span id=sb></span></div></div>
<div class=fn id=fn></div>
<div class=cl><small>Клиенты видят</small><span id=cl></span></div></div>
<script>
const W=window.TelegramWidget||{},$=s=>document.getElementById(s);
let D=null,sk=0;
const mm=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const hm=t=>{const d=new Date(t*1e3);return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')};
function tick(){if(!D)return;const t=Date.now()/1e3-sk,left=D.e-t,all=D.e-D.t0,late=left<=0;
 $('o').className=late?'late':'';$('pv').style.strokeDashoffset=131.9*(1-Math.max(0,left)/all);
 $('tm').textContent=late?'0:00':mm(left);
 $('sb').textContent=late?'Время вышло — «+15 мин» или «Закончить»':'Новые чеки не принимаю, начатые довожу'}
function draw(){let x=null;try{x=JSON.parse(W.chatData)}catch(e){}if(!x)return;D=x;sk=Date.now()/1e3-(x.n||Date.now()/1e3);
 $('hd').textContent='До '+hm(D.e);
 const[d,a]=D.f;$('fn').innerHTML=(d<a?'Довожу начатые заявки: <b>'+d+' из '+a+'</b> готовы':'Начатые заявки доведены: '+a+' из '+a)+'<div class=b><i style="width:'+(a?d/a*100:100)+'%"></i></div>';
 $('cl').textContent=D.c.replace(/%T%/g,hm(D.e));tick()}
W.onEvent?.('chatDataChanged',draw);
draw();setInterval(tick,1e3);
</script>
