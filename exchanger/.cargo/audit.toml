# Проверка уязвимостей зависимостей (`cargo audit`, шаг 3.3–3.4 плана). Каждое исключение —
# с причиной; пересматривать при каждом обновлении зависимостей.
[advisories]
ignore = [
    # libsqlite3-sys: драйвер SQLite у sqlx необязательный, в сборку exch не входит
    # (`cargo tree -i libsqlite3-sys -e all` пуст) — мы работаем только с PostgreSQL. В
    # Cargo.lock он есть, потому что sqlx 0.9 держит версию < 0.39.
    "RUSTSEC-2026-0459",
    # rustybuzz, ttf-parser — «не поддерживаются», исправленной версии нет. Нужны resvg, чтобы
    # пульт нарисовал картинку графика статистики из нашего же SVG: чужие шрифты и SVG туда
    # не попадают.
    "RUSTSEC-2026-0206",
    "RUSTSEC-2026-0192",
]
