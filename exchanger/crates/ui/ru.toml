# Тексты клиентского бота exch (DESIGN-v0.2 §6, SPEC §6). CLAUDE.md, правило 16:
# тексты — здесь, не в коде.
#
# Разметка — Telegram HTML: <b> <i> <u> <s> <code> <tg-spoiler> <a href="…">.
# Символы & < > в тексте пишите как &amp; &lt; &gt;.
#
# Плейсхолдеры:
#   {e_wait} {e_ok} {e_err} {e_warn} {e_invoice} {e_refund} {e_manual} {e_pause}
#   {e_maintenance} {e_ban} {e_support} {e_cb} {e_xr} {e_exchange} {e_rates}
#   {e_history} {e_privacy} {e_copy} {e_bell} {e_promo} {e_invest}
#     — эмодзи: кастомный <tg-emoji>, если у владельца Premium, иначе обычный (SPEC §6.4);
#   остальные {имя} подставляет код; значения уже экранированы, суммы и номера — в <code>.
#
# Тексты кнопок ([menu], [buttons]) — обычный текст без HTML; эмодзи к ним добавляет код
# (при Premium — иконкой icon_custom_emoji_id вместо символа в тексте).
#
# Правило SPEC §6.3: каждая ошибка говорит, где сейчас деньги клиента и что ему делать.

[wallets]
cryptobot = "CryptoBot"
xrocket = "xRocket"

[directions]
xr_to_cb_check = "xRocket → CryptoBot"
cb_to_xr_check = "CryptoBot → xRocket"
pay_cb_invoice = "Оплата счёта CryptoBot"
pay_xr_invoice = "Оплата счёта xRocket"

# Что клиент присылает и что получает — строки таблиц приветствия и «Оплатить счёт».
[offers]
cb_to_xr_check = { send = "Чек CryptoBot", get = "чек xRocket" }
xr_to_cb_check = { send = "Чек xRocket", get = "чек CryptoBot" }
pay_cb_invoice = { send = "Счёт CryptoBot", get = "оплачу из xRocket" }
pay_xr_invoice = { send = "Счёт xRocket", get = "оплачу из CryptoBot" }

[direction_status]
open = "работает"
paused = "пауза"
off = "выключено"
paused_no_reserve = "нет резерва"
paused_maintenance = "обслуживание"
