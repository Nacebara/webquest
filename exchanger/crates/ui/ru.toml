unsupported_asset = "{e_refund} <b>Меняю только USDT</b>\nВ чеке {amount_in}. Верну чеком {src}."
invoice_paid_elsewhere = "{e_refund} <b>Счёт уже оплатил кто-то другой</b>\nВерну {x} чеком {src}."
