maintenance = "{e_maintenance} <b>Обновляемся</b>\nЧек не открывал — деньги в нём. Пришлите его чуть позже."
maintenance_until = "{e_maintenance} <b>Обновляемся до {until}</b>\nЧек не открывал — деньги в нём. Пришлите его после {until}."
daily_limit = "{e_limit} <b>Лимит на сегодня исчерпан</b>\nЧек не открывал — деньги в нём. Новые обмены — после 00:00."
