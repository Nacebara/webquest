not_check_or_invoice = "{e_err} <b>Это не чек и не счёт</b>\nПришлите ссылку вида {cb} или {xr}. Деньги не тронуты."
foreign_bot = "{e_err} <b>Это не официальный кошелёк</b>\nСсылка ведёт на {bot} — я её не открывал. Проверьте, у кого вы взяли чек."
testnet = "{e_err} <b>Чек тестовой сети не подойдёт</b>\nОн ничего не стоит. Пришлите обычный чек CryptoBot или xRocket."
already_activated = "{e_err} <b>Этот чек уже открыт</b>\nДеньги не у меня — их забрал тот, кто открыл чек первым."
