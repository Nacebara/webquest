cancel = "Отмена"
back = "Назад"
copy_order = "Номер заявки"
claim_check = "Забрать чек"
claim = "Забрать"
details = "Детали"
hide = "Скрыть"
copy_link = "Скопировать ссылку"
copy_amount = "Сумма"
pay_by_check = "Пришлю чек {wallet}"
refund = "Вернуть деньги"
support = "Поддержка"
