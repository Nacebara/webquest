# Приветствие /start — макет B1: за пять секунд что делает бот, сколько стоит, что прислать.
[welcome]
title = "{e_exchange} Обмен CryptoBot ⇄ xRocket"
lead = "Пришлите чек — верну чеком другого кошелька. Счёт — оплачу."
col_to = "Куда"
col_fee = "Комиссия"
col_usdt = "USDT"
invoice_row = "Оплата счёта"
paused = "пауза"
# Строка таблицы в простом виде (без rich).
row = "{direction} · {fee} · {range}"
closed = "Сейчас все направления на паузе: чеки не открываю — деньги остаются в них. Загляните чуть позже."
footer = "{e_fast} Курс 1:1 · обычно 10 секунд"

# «Курс и лимиты» (/terms) — макет B1: статус направления точкой, пауза видна сразу.
[terms]
title = "{e_rates} Курс и лимиты"
col_to = "Куда"
col_fee = "Комиссия"
col_usdt = "USDT"
paused = "пауза"
off = "выключено"
# Строка таблицы в простом виде (без rich).
row = "{dot} {direction} · {fee} · {range}"
min_fee = "Комиссия не меньше {min_fee} USDT."
new_user = "Первые обмены — до {max} USDT."
updated = "Обновлено {time}"
fee_from = "от {fee}"
tiers_title = "Комиссия по сумме"
tier_line = "{direction}: {tiers}"
tier_first = "до {to} USDT — {fee}"
tier_next = "от {from} USDT — {fee}"
tier_sep = " · "
promo = "{icon} <b>Сейчас выгодно:</b> {direction} — {fee} на сумму до {up_to} USDT, сверх неё — обычная комиссия."
personal = "Для вас действуют личные условия — они уже учтены в таблице."

# «Обменять» — макет B1: один вопрос, две кнопки, комиссия прямо на кнопке.
[exchange]
title = "<b>Что меняем?</b>"
button = "{direction} · {fee}"
button_paused = "{direction} · пауза"
paused = "{e_pause} <i>{direction} на паузе: {why}</i>"

# «Пришлите чек» — макет B1: как создать чек одной строкой, команда копируется кнопкой.
[send_check]
title = "<b>Пришлите чек {src}</b> · {min}–{max}\u00A0USDT"
hint = "Наберите здесь {cmd} и выберите чек."

[howto]
title = "<b>Как создать чек {wallet}</b>"
quick_title = "<b>Быстро — прямо в этом чате:</b>"
menu_title = "<b>Через меню {wallet}:</b>"
rules = "Чек — в USDT, для одного человека, без капчи и подписок."

[howto.cryptobot]
steps = [
    "Наберите {cmd} — вместо {amount} ваша сумма.",
    "Выберите в списке чек на эту сумму и отправьте.",
    "Чек появится здесь — я сразу его заберу.",
]
menu = "{cmd} → «Создать чек» → USDT → сумма → скопируйте ссылку и пришлите сюда."

[howto.xrocket]
steps = [
    "Наберите {cmd} — вместо {amount} ваша сумма.",
    "Выберите чек в USDT и отправьте.",
    "Чек появится здесь — я сразу его заберу.",
]
menu = "{cmd} → «Персональный» → «Создать чек» → USDT → сумма → ссылку пришлите сюда."

[invoice_prompt]
# «Оплатить счёт» — карточка (выбор владельца 8 ноября 2026, вариант В): что оплачиваю, чем
# платить, сколько стоит. Ссылку можно слать сразу; пересланное сообщение магазина тоже читается.
title = "{e_invoice} Оплачу ваш счёт"
col_invoice = "Счёт"
col_pay = "Платите чеком"
col_fee = "Комиссия"
col_usdt = "USDT"
row = "{dot} Счёт {invoice} — чеком {pay} · {fee}"
row_range = "{dot} Счёт {invoice} — чеком {pay} · {fee} · {range}"
body = "Пришлите ссылку на счёт — назову сумму чека."
footer = "{e_fast} Одноразовые счета с суммой · {min}–{max}\u00A0USDT"
footer_bare = "{e_fast} Одноразовые счета с суммой"

# Ход обмена — макет B1: одно сообщение, одна строка на шаг, дальше только правится.
[order]
# {icon} — три точки «в работе» / «отправляю»; если шаг затянулся — часы (макет «Долго»).
checking = "{icon} Проверяю чек"
checking_amount = "{icon} Проверяю чек на {amount} USDT"
sending = "{icon} Отправляю {payout} USDT в {dst}"
slow = "<i>Дольше обычного. Деньги у меня — ничего делать не нужно.</i>"
done = "{e_ok} <b>{payout}\u00A0USDT</b> ждут вас в {dst}"
details = """{e_ok} <b>{payout}\u00A0USDT</b> ждут вас в {dst}
<blockquote>Получено {amount_in} · комиссия {fee_pct} ({fee})
Заявка {order} · {took}</blockquote>"""

# Оплата счёта — макет B1: сумма к оплате на синей кнопке, срок цены одной строкой.
[invoice]
quote = """{e_invoice} <b>Счёт {inv_wallet}</b> · {inv_amount}{fiat}{description}
Пришлите чек {src} на {x}
<i>Цена держится до {expires}.</i>"""
description = "\n<i>{text}</i>"
fiat = " ({fiat}; курс сдвинется больше чем на {buffer} — верну деньги)"
awaiting = """{e_invoice} <b>Жду чек {src}</b> на {x}
<i>Цена держится до {expires}.</i>"""
underpaid = """{e_warn} <b>Не хватает {rest}</b>
Пришлите ещё чек на {rest_short} или верну {got_short}."""
paying = "{e_sending} Оплачиваю счёт {inv_wallet}"
paid = """{e_ok} <b>Счёт оплачен</b> · {inv_amount}
<blockquote expandable>Получено {x_short} · комиссия {fee_pct} ({fee_short})
Заявка {order} · {time}</blockquote>"""
excess_refund = """{e_ok} <b>Счёт оплачен</b> · {inv_amount}
Лишние {excess} вернул чеком {src}."""
excess_refund_pending = """{e_ok} <b>Счёт оплачен</b> · {inv_amount}
Лишние {excess} возвращаю чеком {src}."""
excess_kept = """{e_ok} <b>Счёт оплачен</b> · {inv_amount}
Лишние {excess} меньше {min_refund} — оставил в счёт комиссии."""

# Ручная проверка — макет B1: деньги у нас, автоматика не справилась. Главное — не пугать.
[manual]
review = """{e_manual} <b>Проверяю вручную</b>
Деньги у меня: {amount}. Обычно до {minutes}.
<i>Ничего делать не нужно — напишу сюда.</i>"""
review_unknown = """{e_manual} <b>Проверяю вручную</b>
Кошелёк не ответил вовремя — сверяю, дошёл ли чек. Если деньги у меня, они в безопасности; если нет — остались в чеке. Обычно до {minutes}.
<i>Ничего делать не нужно — напишу сюда.</i>"""

# Возврат — макет B1: сначала — почему; забирается той же зелёной кнопкой.
[refund]
started = """{e_refund} <b>Возвращаю {refund}</b>
{reason}."""
done = """{e_ok} <b>Возврат готов</b> · чек {src}
{refund}, без комиссии"""
# Чек меньше минимума: возврат сразу, та же строка до и после (макет «Меньше минимума»).
below_minimum = """{e_refund} <b>Меньше минимума</b> · от {min}
Верну {refund_short} чеком {src}."""
claim = "Забрать {amount}\u00A0USDT"

# Почему возвращаем — одна фраза (вторая строка экрана возврата).
[refund_reasons]
below_minimum = "Сумма меньше минимума {min}"
above_maximum = "Сумма больше текущего лимита {max}"
unsupported_asset = "Меняю только USDT"
invoice_paid_elsewhere = "Счёт уже оплатил кто-то другой"
invoice_expired = "Счёт истёк до оплаты"
rate_moved = "Курс доллара сдвинулся сильнее запаса, пока шёл чек"
client_request = "Вы попросили вернуть деньги"
underpaid = "Не пришла вся сумма для оплаты счёта"
operator = "Так решил оператор"

# Ошибки — макет B1: жирная строка «что случилось», вторая — где деньги и что прислать.
