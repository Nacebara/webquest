below_minimum = "{e_refund} <b>Меньше минимума</b> · от {min}\nВерну {amount_short} чеком {src}."
above_maximum = "{e_refund} <b>Больше лимита</b> · до {max}\nВерну {amount_short} чеком {src}. Разбейте сумму на части."
