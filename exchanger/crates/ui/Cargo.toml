[package]
name = "ui"
description = "Интерфейс клиентского бота: экраны HTML + rich, клавиатуры, главное меню, эмодзи (чистый рендер, без IO)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Только типы Bot API: HTTP-клиент (reqwest) этому крейту не нужен.
botapi = { path = "../botapi", default-features = false }
chrono.workspace = true
domain.workspace = true
serde.workspace = true
thiserror.workspace = true
# Тексты в ru.toml (CLAUDE.md, правило 16).
toml = { version = "1.1.6", default-features = false, features = ["std", "serde", "parse"] }

[dev-dependencies]
insta = { version = "1.49.0", default-features = false }
proptest.workspace = true
rust_decimal.workspace = true
rust_decimal_macros.workspace = true
serde_json = "1.0.149"

[lints]
workspace = true
