<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#eef1f4;font:14px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif;color:#1b2430}
.grid{display:grid;grid-template-columns:repeat(3,420px);gap:18px;padding:18px}
.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 1px 0 #dde3ea}
.card h4{margin:0 0 10px;font-size:15px}.card p{margin:8px 0 0;color:#5d6b7a;font-size:13px}
.top{display:flex;gap:14px;align-items:center}
.big{width:200px;height:200px;border-radius:50%;overflow:hidden;flex:none}
.strips{display:grid;gap:8px;flex:1}
.strip{display:flex;gap:10px;align-items:center;justify-content:center;border-radius:12px;padding:10px 6px}
.strip.d{background:#0e1621}.strip.l{background:#f4f6f8;border:1px solid #e3e8ee}
.av{border-radius:50%;overflow:hidden;flex:none}
.chat{margin-top:12px;border-radius:12px;overflow:hidden;border:1px solid #e3e8ee}
.row{display:flex;gap:10px;align-items:center;padding:8px 10px}
.row.d{background:#17212b;color:#f5f5f5}.row.l{background:#fff}
.row b{font-size:14.5px;display:block}.row small{font-size:13px;color:#7f91a4;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:250px}
.row .t{margin-left:auto;font-size:12px;color:#7f91a4;align-self:flex-start}
svg{display:block;width:100%;height:100%}
#solo{position:fixed;left:0;top:0;width:640px;height:640px}
</style></head><body><div class="grid" id="g"></div><div id="solo"></div>
<script>
const shade=(hex,k)=>{const to=k>0?255:0;return '#'+[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)).map(x=>Math.round(x+(to-x)*Math.abs(k)).toString(16).padStart(2,'0')).join('')};
const AMBER='#CC7300', NIGHT='#283050', W='#fff';
let seq=0;
function bg(color,hi=0.10,lo=-0.16){const id='b'+(++seq);return `<defs><linearGradient id="${id}g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${shade(color,hi)}"/><stop offset="1" stop-color="${shade(color,lo)}"/></linearGradient><linearGradient id="${id}h" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".7" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><rect width="24" height="24" fill="url(#${id}g)"/><rect width="24" height="24" fill="url(#${id}h)"/>`}
const g=(body,sw=2.1,tr='')=>`<g fill="none" stroke="${W}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"${tr?` transform="${tr}"`:''}>${body}</g>`;
const at=(s,cx=12,cy=12)=>`translate(${cx} ${cy}) scale(${s}) translate(-12 -12)`;
const SWAP='<path d="M5.6 9h12.2M14.8 5.9l3.1 3.1-3.1 3.1"/><path d="M18.4 15H6.2M9.2 11.9L6.1 15l3.1 3.1"/>';
const EARROW='<path d="M7 11h10"/><path d="M17 11A5 5 0 1 0 12 16"/><path d="M12 16h4.4"/><path d="M14.5 14.1l1.9 1.9-1.9 1.9"/>';
function tileOnNight(body,sw,s){const id='t'+(++seq);return `<defs><radialGradient id="${id}n" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="${shade(NIGHT,0.12)}"/><stop offset="1" stop-color="${shade(NIGHT,-0.25)}"/></radialGradient><linearGradient id="${id}g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${shade(AMBER,0.12)}"/><stop offset="1" stop-color="${shade(AMBER,-0.08)}"/></linearGradient><linearGradient id="${id}h" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".7" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><rect width="24" height="24" fill="url(#${id}n)"/><rect x="4.3" y="4.3" width="15.4" height="15.4" rx="4.8" fill="url(#${id}g)"/><rect x="4.3" y="4.3" width="15.4" height="15.4" rx="4.8" fill="url(#${id}h)"/>`+g(body,sw,s)}
const C=[
 {id:'n1',name:'1 · Обмен',note:'Наш значок «Обмен» во весь круг: стрелки туда и обратно. Самый крупный знак в 28 px. Минус — такой знак есть у многих обменников.',
  svg:()=>bg(AMBER)+g(SWAP,1.8,at(1.1))},
 {id:'n2',name:'2 · Плитка на ночном',note:'Ровно наш премиум-эмодзи «Обмен»: оранжевая плитка на тёмно-синем круге. Сразу видно семью значков бота; выделяется в обеих темах.',
  svg:()=>tileOnNight(SWAP,1.9,at(0.62))},
 {id:'n3',name:'3 · «e» → стрелка',note:'Монограмма: «e» из eXCH одной линией, хвост уходит стрелкой вправо — «отдал → получил». Свой знак, такого нет ни у кого.',
  svg:()=>bg(AMBER)+g(EARROW,2.0,at(1.12,12,13.5))},
 {id:'n4',name:'4 · Плитка с «e»',note:'Монограмма на нашей плитке на ночном круге: свой знак и семья эмодзи сразу.',
  svg:()=>tileOnNight(EARROW,1.9,at(0.66,12,13.5))},
 {id:'n5',name:'5 · Оборот',note:'Две стрелки гонятся вокруг монеты. Минус — похоже на «Обновить».',
  svg:()=>bg(AMBER)+g('<path d="M6.3 10.2A6 6 0 0 1 16.9 8.4"/><path d="M17.7 13.8A6 6 0 0 1 7.1 15.6"/><path d="M17.3 5.6l-.3 2.9-2.9-.3"/><path d="M6.7 18.4l.3-2.9 2.9.3"/>',1.8,at(1.04))+`<circle cx="12" cy="12" r="2.3" fill="${W}"/>`},
 {id:'n6',name:'6 · Обмен на ночном',note:'Тот же «Обмен» во весь круг, но фон — ночной, стрелки — оранжевые. Строже и дороже, меньше похоже на «ещё один обменник».',
  svg:()=>{const id='q'+(++seq);return `<defs><radialGradient id="${id}n" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="${shade(NIGHT,0.12)}"/><stop offset="1" stop-color="${shade(NIGHT,-0.25)}"/></radialGradient><linearGradient id="${id}a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${shade(AMBER,0.3)}"/><stop offset="1" stop-color="${shade(AMBER,0)}"/></linearGradient></defs><rect width="24" height="24" fill="url(#${id}n)"/><g fill="none" stroke="url(#${id}a)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="${at(1.1)}">${SWAP}</g>`}},
];
const svg=(c)=>`<svg viewBox="0 0 24 24">${c.svg()}</svg>`;
const av=(c,s)=>`<div class="av" style="width:${s}px;height:${s}px">${svg(c)}</div>`;
document.getElementById('g').innerHTML=C.map(c=>`<div class="card" id="${c.id}"><h4>${c.name}</h4><div class="top"><div class="big">${svg(c)}</div><div class="strips"><div class="strip d">${av(c,56)}${av(c,40)}${av(c,28)}</div><div class="strip l">${av(c,56)}${av(c,40)}${av(c,28)}</div></div></div>
<div class="chat"><div class="row l">${av(c,48)}<div><b>exch</b><small>97.50 USDT ждут вас в xRocket</small></div><span class="t">14:05</span></div><div class="row d">${av(c,48)}<div><b>exch</b><small>97.50 USDT ждут вас в xRocket</small></div><span class="t">14:05</span></div></div><p>${c.note}</p></div>`).join('');
window.SOLO=(i)=>{document.getElementById('solo').innerHTML=svg(C[i])};
window.N=C.length;document.title='ready';
</script></body></html>
