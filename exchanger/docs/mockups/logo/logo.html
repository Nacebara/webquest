<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Man;src:url(node_modules/@fontsource/manrope/files/manrope-latin-800-normal.woff2)}
body{margin:0;background:#eef1f4;font:14px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif;color:#1b2430;width:1360px}
section{margin:18px;background:#fff;border-radius:20px;padding:18px 20px}
h2{margin:0 0 4px;font-size:19px}.lead{margin:0 0 14px;color:#5d6b7a}
.g{display:grid;grid-template-columns:repeat(8,1fr);gap:14px}
.it{display:grid;justify-items:center;gap:6px;text-align:center;font-size:12.5px;color:#5d6b7a}
.it b{color:#1b2430;font-size:13px}
.av{border-radius:50%;overflow:hidden}
.sm{display:flex;gap:6px;align-items:center;justify-content:center;background:#0e1621;border-radius:10px;padding:6px 8px}
.sm.l{background:#f4f6f8}
.fin{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.fc{border:1px solid #e3e8ee;border-radius:16px;padding:14px}
.fc h3{margin:0 0 10px;font-size:15px}
.lk{display:flex;align-items:center;gap:12px;border-radius:12px;padding:14px;margin-top:10px}
.lk .t{width:48px;height:48px;border-radius:15px;overflow:hidden}
.wm{font:800 36px/1 Man,sans-serif;letter-spacing:-.035em}
.lk.l{background:#f4f6f8}.lk.l .wm{color:#16202c}.lk.d{background:#0e1621}.lk.d .wm{color:#fff}
.row{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;margin-top:8px}
.row.l{background:#fff;border:1px solid #e3e8ee}.row.d{background:#17212b;color:#f5f5f5}
.row b{display:block;font-size:14.5px}.row small{color:#7f91a4;font-size:13px}
svg{display:block;width:100%;height:100%}
#solo{position:fixed;left:0;top:0;width:640px;height:640px}
</style></head><body><div id="root"></div><div id="solo"></div>
<script>
const shade=(h,k)=>{const to=k>0?255:0;return '#'+[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)).map(x=>Math.round(x+(to-x)*Math.abs(k)).toString(16).padStart(2,'0')).join('')};
let q=0;
const W='#fff';
// Фоны
const BG={
 green:{n:'Ярко-зелёный',c:'#1FC46A'},
 emerald:{n:'Изумрудный',c:'#0FA968'},
 lime:{n:'Салатовый → зелёный',c:'#46D25C',to:'#13A85A'},
 teal:{n:'Зелёный → бирюза',c:'#22C55E',to:'#0E9FA6'},
 night:{n:'Ночной',c:'#1E2742',coin:'#1FC46A'},
 black:{n:'Чёрный',c:'#14171C',coin:'#1FC46A'},
 white:{n:'Белый',c:'#FFFFFF',coin:'#1FC46A',light:1},
 blue:{n:'Синий',c:'#2F6BEA'},
};
function bg(key){const b=BG[key],i='b'+(++q);
 const a=b.to?shade(b.c,0.06):shade(b.c,0.14), z=b.to?b.to:shade(b.c,-0.14);
 const gl=b.light?'':`<linearGradient id="${i}h" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".7" stop-color="#fff" stop-opacity="0"/></linearGradient>`;
 return `<defs><linearGradient id="${i}g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${z}"/></linearGradient>${gl}</defs><rect width="24" height="24" fill="url(#${i}g)"/>${gl?`<rect width="24" height="24" fill="url(#${i}h)"/>`:''}`}
const S=(body,sw,c,tr='')=>`<g fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"${tr?` transform="${tr}"`:''}>${body}</g>`;
const at=(s,cx=12,cy=12,r=0)=>`translate(${cx} ${cy}) rotate(${r}) scale(${s}) translate(-12 -12)`;
const SWAP='<path d="M5.6 9h12.2M14.8 5.9l3.1 3.1-3.1 3.1"/><path d="M18.4 15H6.2M9.2 11.9L6.1 15l3.1 3.1"/>';
// Знак: монета + внутреннее; coin — цвет монеты, ink — цвет стрелок
const MARK={
 a:{n:'Классика',d:'монета, кант, стрелки',f:(coin,ink)=>`<circle cx="12" cy="12" r="7.4" fill="${coin}"/><circle cx="12" cy="12" r="6.2" fill="none" stroke="${ink}" stroke-opacity=".28" stroke-width=".6"/>`+S(SWAP,1.9,ink,at(.58))},
 b:{n:'Без канта',d:'стрелки толще',f:(coin,ink)=>`<circle cx="12" cy="12" r="7.6" fill="${coin}"/>`+S(SWAP,2.4,ink,at(.6))},
 c:{n:'Сплошные стрелки',d:'формы вместо линий',f:(coin,ink)=>`<circle cx="12" cy="12" r="7.6" fill="${coin}"/><g transform="${at(.62)}" fill="${ink}" stroke="${ink}" stroke-width="1.2" stroke-linejoin="round"><path d="M5.4 7.7H14.2V5.9L18.8 8.9 14.2 11.9V10.1H5.4Z"/><path d="M18.6 16.3H9.8V18.1L5.2 15.1 9.8 12.1V13.9H18.6Z"/></g>`},
 d:{n:'Стрелки сквозь монету',d:'кольцо, выходят наружу',f:(coin,ink,bgc)=>`<circle cx="12" cy="12" r="6.6" fill="none" stroke="${coin}" stroke-width="1.6"/>`+S('<path d="M4.2 9.6h13.4M15 6.8l2.8 2.8-2.8 2.8"/><path d="M19.8 14.4H6.4M9 11.6l-2.8 2.8L9 17.2"/>',2.2,coin)},
 e:{n:'Наискось',d:'стрелки по диагонали',f:(coin,ink)=>`<circle cx="12" cy="12" r="7.6" fill="${coin}"/>`+S(SWAP,2.1,ink,at(.6,12,12,-35))},
 f:{n:'Две половины',d:'монета расколота обменом',f:(coin,ink)=>`<path d="M12 4.4A7.6 7.6 0 0 0 4.4 12H19.6A7.6 7.6 0 0 0 12 4.4Z" fill="${coin}" transform="translate(-0.9 -0.7)"/><path d="M12 19.6A7.6 7.6 0 0 0 19.6 12H4.4A7.6 7.6 0 0 0 12 19.6Z" fill="${coin}" fill-opacity=".82" transform="translate(0.9 0.7)"/>`+S('<path d="M8 8.6h6.6M12.6 6.6l2 2-2 2"/><path d="M16 15.4H9.4M11.4 13.4l-2 2 2 2"/>',1.7,ink)},
 g:{n:'Оборот',d:'две дуги вокруг',f:(coin,ink)=>`<circle cx="12" cy="12" r="7.6" fill="${coin}"/>`+S('<path d="M8 10.2A4.4 4.4 0 0 1 15.7 8.6"/><path d="M16 13.8A4.4 4.4 0 0 1 8.3 15.4"/><path d="M15.9 6.4l-.1 2.3-2.3-.1"/><path d="M8.1 17.6l.1-2.3 2.3.1"/>',1.8,ink)},
 h:{n:'Мягкий',d:'тоньше, воздух',f:(coin,ink)=>`<circle cx="12" cy="12" r="7.2" fill="${coin}"/>`+S(SWAP,1.5,ink,at(.55))},
};
function avatar(bgKey,markKey){const b=BG[bgKey];const coin=b.coin||W;const ink=b.coin?W:(b.light?W:shade(b.to||b.c,-0.05));
 const m=MARK[markKey];return `<svg viewBox="0 0 24 24">${bg(bgKey)}${m.f(coin,b.coin? '#fff' : ink, b.c)}</svg>`}
const av=(b,m,s)=>`<div class="av" style="width:${s}px;height:${s}px${BG[b].light?';box-shadow:inset 0 0 0 1px #e3e8ee':''}">${avatar(b,m)}</div>`;
const it=(b,m,label,sub)=>`<div class="it">${av(b,m,96)}<b>${label}</b><span>${sub}</span><div class="sm">${av(b,m,40)}${av(b,m,28)}</div><div class="sm l">${av(b,m,40)}${av(b,m,28)}</div></div>`;
const FIN=[['green','b','А · Ярко-зелёный'],['night','b','Б · Ночной, зелёная монета'],['teal','e','В · Зелёный → бирюза, наискось']];
const tileSvg=(b,m)=>`<svg viewBox="0 0 24 24"><defs><clipPath id="c${++q}"><rect width="24" height="24" rx="7.4"/></clipPath></defs><g clip-path="url(#c${q})">${avatar(b,m).replace('<svg viewBox="0 0 24 24">','').replace('</svg>','')}</g></svg>`;
document.getElementById('root').innerHTML=
`<section><h2>1 · Фоны — тот же знак</h2><p class="lead">Монета-обмен (ваш выбор) на восьми фонах. Под каждым — 40 и 28 px на тёмной и светлой теме.</p><div class="g">${Object.keys(BG).map(k=>it(k,'a',BG[k].n,'')).join('')}</div></section>`+
`<section><h2>2 · Линии и идеи внутри монеты — на ярко-зелёном</h2><p class="lead">Толщина, сплошные формы, стрелки наружу, наискось, монета из половин, оборот.</p><div class="g">${Object.keys(MARK).map(k=>it('green',k,MARK[k].n,MARK[k].d)).join('')}</div></section>`+
`<section><h2>3 · Финалисты — как это будет жить</h2><p class="lead">Аватарка, связка со словом «exch», строка в списке чатов.</p><div class="fin">${FIN.map(([b,m,n])=>`<div class="fc"><h3>${n}</h3><div style="display:flex;gap:14px;align-items:center">${av(b,m,150)}<div><div class="sm" style="margin-bottom:6px">${av(b,m,56)}${av(b,m,40)}${av(b,m,28)}</div><div class="sm l">${av(b,m,56)}${av(b,m,40)}${av(b,m,28)}</div></div></div><div class="lk l"><div class="t">${tileSvg(b,m)}</div><span class="wm">exch</span></div><div class="lk d"><div class="t">${tileSvg(b,m)}</div><span class="wm">exch</span></div><div class="row l">${av(b,m,46)}<div><b>exch</b><small>97.50 USDT ждут вас в xRocket</small></div></div><div class="row d">${av(b,m,46)}<div><b>exch</b><small>97.50 USDT ждут вас в xRocket</small></div></div></div>`).join('')}</div></section>`;
window.FIN=FIN;window.SOLO=(i)=>{const [b,m]=FIN[i];document.getElementById('solo').innerHTML=avatar(b,m)};
document.fonts.load('36px Man','exch').then(()=>document.fonts.ready).then(()=>{document.title='ready'});
</script></body></html>
