<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}#a{width:800px;height:800px}</style></head><body><div id="a"></div><script>
const shade=(h,k)=>{const to=k>0?255:0;return '#'+[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)).map(x=>Math.round(x+(to-x)*Math.abs(k)).toString(16).padStart(2,'0')).join('')};
const C='#22C55E', TO='#0E9FA6', A=shade(C,0.06), INK=shade(TO,-0.05);
const SWAP='<path d="M5.6 9h12.2M14.8 5.9l3.1 3.1-3.1 3.1"/><path d="M18.4 15H6.2M9.2 11.9L6.1 15l3.1 3.1"/>';
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
// t in [0,1): 0–.13 покой, .13–.47 стрелки делают пол-оборота, .47–1 покой и блик
function frame(t){
  let r=-35;
  if(t>=.13&&t<.47){r=-35+180*ease((t-.13)/.34)}else if(t>=.47){r=145}
  // монета чуть «дышит» в момент обмена
  const k=(t>=.13&&t<.47)?Math.sin(Math.PI*(t-.13)/.34):0;
  const s=1+0.035*k;
  // блик: полоса проходит по фону во второй половине
  const shine=(t>=.55&&t<.9)?(t-.55)/.35:-1;
  const sx=-12+48*shine;
  const shineEl=shine<0?'':`<g clip-path="url(#cl)" opacity=".22"><rect x="${sx}" y="-6" width="5" height="36" fill="#fff" transform="rotate(25 12 12)"/></g>`;
  document.getElementById('a').innerHTML=`<svg viewBox="0 0 24 24" width="800" height="800"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${A}"/><stop offset="1" stop-color="${TO}"/></linearGradient><linearGradient id="h" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".7" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="cl"><rect width="24" height="24"/></clipPath></defs>
  <rect width="24" height="24" fill="url(#g)"/><rect width="24" height="24" fill="url(#h)"/>${shineEl}
  <g transform="translate(12 12) scale(${s}) translate(-12 -12)"><circle cx="12" cy="12" r="7.6" fill="#fff"/>
  <g fill="none" stroke="${INK}" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" transform="translate(12 12) rotate(${r}) scale(.6) translate(-12 -12)">${SWAP}</g></g></svg>`;
}
window.frame=frame; frame(0); document.title='ready';
</script></body></html>
