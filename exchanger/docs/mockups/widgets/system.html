<style>
:root{color-scheme:light dark;--ok:light-dark(#1f9d55,#3fca74);--wa:light-dark(#d98200,#f2a93b);--bd:light-dark(#e0453a,#ff6b5e);--h:var(--tg-theme-hint-color,#8a96a3);--a:var(--tg-theme-button-color,#3390ec);--ln:light-dark(#e1e6eb,#2f3c49);--tx:var(--tg-theme-text-color,#000)}
body{margin:0;padding:4px 12px max(10px,var(--tg-content-safe-area-inset-bottom,0px));font-variant-numeric:tabular-nums}
.r{display:grid;grid-template-columns:14px 1fr auto auto;gap:8px;align-items:center;padding:7px 0;font-size:.9em}
.r+.r{border-top:1px solid var(--ln)}
.r i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.r i.w{background:var(--wa)}.r i.x{background:var(--bd)}
.r b{font-weight:500;text-align:right}
.r svg{width:48px;height:14px}
.r path{fill:none;stroke:var(--a);stroke-width:1.4}
.bn{margin:6px 0 4px;padding:7px 10px;border-radius:10px;font-size:.86em;font-weight:600;color:#fff;background:var(--wa)}
.ft{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:.76em;color:var(--h)}
.ft i{width:7px;height:7px;border-radius:50%;background:var(--ok)}.ft i.x{background:var(--bd)}
</style>
<div class=bn id=bn hidden>Бот не отвечает — цифры ниже могут быть старыми</div>
<div id=l></div><div class=ft><i id=fi></i><span id=ft></span></div>
<script>
const W=window.TelegramWidget||{},$=s=>document.getElementById(s);
let D=null,sk=0,got=0,miss=0;
const up=s=>{const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return d?d+' дн '+h+' ч':h?h+' ч '+m+' мин':m+' мин'};
const mm=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function sp(v){const mx=Math.max(...v,1),pt=v.map((y,j)=>(j/(v.length-1)*48).toFixed(1)+','+(13-y/mx*12).toFixed(1));return '<svg viewBox="0 0 48 14"><path d="M'+pt.join('L')+'"/></svg>'}
function draw(){if(!D)return;const t=Date.now()/1e3-sk;
 $('l').innerHTML=D.r.map(r=>{const[lv,n,v,k,ts,h]=r;let val=v;if(k=='up')val=v+' · работает '+up(t-ts);if(k=='cd')val=ts>t?v+' ещё '+mm(ts-t):'проверяю связь';
  return '<div class=r><i class="'+['','w','x'][lv]+'"></i><span>'+n+'</span>'+(h?sp(h):'<span></span>')+'<b>'+val+'</b></div>'}).join('')}
function foot(){const a=Math.floor((Date.now()-got)/1e3),bad=miss>1;$('bn').hidden=!bad;$('fi').className=bad?'x':'';$('ft').textContent=bad?'Нет связи с ботом':'Обновлено '+(a<15?'только что':Math.floor(a/60)+' мин назад')}
function set(x){if(!x)return;D=x;got=Date.now();sk=Date.now()/1e3-(x.u||Date.now()/1e3);draw();foot()}
function pull(){if(!W.request||W.chatType!='private'||!W.isActive)return;W.request('sys').then(a=>{miss=0;try{set(JSON.parse(a.result))}catch(e){}},e=>{if(e.code!='BUSY'&&e.code!='RATE_LIMITED'){miss++;foot()}})}
W.onEvent?.('chatDataChanged',()=>{try{set(JSON.parse(W.chatData))}catch(e){}});
W.onEvent?.('activated',pull);
try{set(JSON.parse(W.chatData))}catch(e){}
setInterval(draw,1e3);setInterval(foot,5e3);setInterval(pull,1e4);pull();
</script>
