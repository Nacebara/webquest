<style>
:root{color-scheme:light dark;--ok:light-dark(#1f9d55,#3fca74);--wa:light-dark(#d98200,#f2a93b);--h:var(--tg-theme-hint-color,#8a96a3);--a:var(--tg-theme-button-color,#3390ec);--ln:light-dark(#d5dbe1,#3a4756);--bg:var(--tg-theme-bg-color,#fff);--tx:var(--tg-theme-text-color,#000)}
body{margin:0;padding:10px 12px max(8px,var(--tg-content-safe-area-inset-bottom,0px));font-variant-numeric:tabular-nums}
.rt{display:flex;align-items:center;gap:8px;font-size:.92em;white-space:nowrap}
.rt span{color:var(--h)}.rt b{font-weight:600}
.fin .rt b{color:var(--ok)}
.ar{display:inline-flex;gap:3px}
.ar i{width:4px;height:4px;border-radius:50%;background:var(--a);animation:f 1.2s infinite}
.ar i:nth-child(2){animation-delay:.2s}.ar i:nth-child(3){animation-delay:.4s}
@keyframes f{50%{background:var(--ln)}}
.fin .ar i{animation:none;background:var(--ok)}.man .ar i{animation:none;background:var(--wa)}
ol{display:grid;grid-template-columns:repeat(4,1fr);list-style:none;margin:12px 0 0;padding:0;font-size:.74em;line-height:1.2;color:var(--h);text-align:center}
li{position:relative;padding:20px 2px 0}
li:before{content:"";position:absolute;z-index:1;top:0;left:50%;margin-left:-7px;width:10px;height:10px;border-radius:50%;border:2px solid var(--ln);background:var(--bg);color:#fff;font-size:9px;line-height:10px;font-weight:700}
li+li:after{content:"";position:absolute;top:6px;right:50%;width:100%;height:2px;background:var(--ln)}
.d,.n{color:var(--tx)}
.d:before{content:"✓";background:var(--ok);border-color:var(--ok)}
.d:after,.n:after{background:var(--ok)!important}
.n{font-weight:600}
.n:before{border-color:var(--a);animation:p 1.6s ease-in-out infinite}
@keyframes p{50%{box-shadow:0 0 0 4px light-dark(rgba(51,144,236,.18),rgba(106,179,243,.22))}}
.s:before{content:"!";background:var(--wa);border-color:var(--wa);animation:none}
.nt{margin:10px 0 0;font-size:.86em;color:var(--wa)}
.ft{display:flex;justify-content:space-between;gap:8px;margin-top:10px;font-size:.84em;color:var(--h)}
.ft b{color:var(--tx);font-weight:500}
button{all:unset;cursor:pointer;color:var(--tg-theme-link-color,#3390ec)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<div id=o>
<div class=rt><span id=i></span><span class=ar><i></i><i></i><i></i></span><b id=p></b></div>
<ol id=st><li>Чек принят<li>Деньги у меня<li>Выплата<li>Готово</ol>
<p class=nt id=nt hidden></p>
<div class=ft><span>Комиссия <b id=fe></b></span><span id=tm></span></div>
<div class=ft><button id=id></button></div>
</div>
<script>
const W=window.TelegramWidget||{},$=s=>document.getElementById(s),E={CryptoBot:'🔷',xRocket:'🚀'};
let D=null,tk=0;
const pl=(n,f)=>{n%=100;const m=n%10;return f[n>10&&n<20?2:m==1?0:m>1&&m<5?1:2]};
const du=s=>s<60?s+' '+pl(s,['секунду','секунды','секунд']):Math.floor(s/60)+' мин '+s%60+' с';
const now=()=>Math.floor(Date.now()/1e3);
function tick(){if(!D)return;const t=Math.max(0,(D.t1||now())-D.t0);$('tm').textContent=D.t1?'за '+du(t):'идёт '+Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}
function draw(){let x=null;try{x=JSON.parse(W.chatData)}catch(e){}
 const was=D&&D.st;D=x;if(!D)return;const st=D.st;
 $('o').className=st=='done'?'fin':st=='manual'||st=='slow'?'man':'';
 $('i').textContent=D.in+' '+E[D.src]+' '+D.src;$('p').textContent=D.out+' '+E[D.dst]+' '+D.dst;
 $('fe').textContent=D.pct+' · '+D.fee;
 const k={check:0,send:2,slow:2,done:4,manual:D.k|0}[st]??0;
 [...$('st').children].forEach((l,j)=>l.className=j<k?'d':j==k?(st=='slow'||st=='manual'?'n s':'n'):'');
 const n=$('nt');n.hidden=!(st=='slow'||st=='manual');
 n.textContent=st=='slow'?'Дольше обычного. Деньги у меня — ничего делать не нужно.':'Проверяю вручную, обычно до 15 минут. Деньги у меня — напишу сюда.';
 $('id').textContent='Заявка '+D.id+' ⧉';
 tick();clearInterval(tk);if(!D.t1)tk=setInterval(tick,1e3);
 if(st=='done'&&was&&was!='done')W.HapticFeedback?.notificationOccurred('success')}
$('id').onclick=()=>D&&W.copyText?.(D.id);
W.onEvent?.('chatDataChanged',draw);
draw();
</script>
