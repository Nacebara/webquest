<style>
:root{color-scheme:light dark;--ok:light-dark(#1f9d55,#3fca74);--fi:light-dark(#e8590c,#ff8a3d);--h:var(--tg-theme-hint-color,#8a96a3);--t:var(--tg-theme-secondary-bg-color,#eef1f4);--a:var(--tg-theme-button-color,#3390ec);--at:var(--tg-theme-button-text-color,#fff);--ln:light-dark(#d9dfe5,#36434f);--bg:var(--tg-theme-bg-color,#fff)}
body{margin:0;padding:10px 12px max(10px,var(--tg-content-safe-area-inset-bottom,0px));font-variant-numeric:tabular-nums}
button{all:unset;box-sizing:border-box;cursor:pointer;text-align:center}
.pr{background:var(--t);border-radius:10px;padding:8px 12px 10px;font:.9em/1.5 ui-monospace,monospace}
.hd{font:600 .78em/1.4 system-ui,sans-serif;color:var(--tg-theme-link-color,#3390ec);margin-bottom:4px}
.r{display:flex;justify-content:space-between;gap:8px}
.r b{font-weight:400}
.fi{color:var(--fi)}
hr{border:0;border-top:1px solid var(--ln);margin:4px 0}
.t b{font-weight:700;font-size:1.12em;color:var(--ok)}
#tr{position:relative;height:36px;margin:8px 13px 0;touch-action:pan-y}
#tr:before{content:"";position:absolute;left:0;right:0;top:16px;height:4px;border-radius:2px;background:var(--ln)}
#pz{position:absolute;left:0;top:16px;height:4px;border-radius:2px;background:light-dark(#ffd8bf,#5a3420)}
#lk{position:absolute;right:0;top:13px;height:10px;border-radius:5px;border:1px dashed var(--h);box-sizing:border-box}
#fl{position:absolute;left:0;top:16px;height:4px;border-radius:2px;background:var(--a)}
#th{position:absolute;top:5px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:light-dark(#fff,#eef2f6);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.sc{display:flex;justify-content:space-between;margin:0 6px 8px;font-size:.72em;color:var(--h)}
#pl{color:var(--fi)}
#cp{display:block;width:100%;padding:10px;border-radius:10px;background:var(--a);color:var(--at);font-weight:600;font-size:.92em}
#cp:active{filter:brightness(.92)}
#cp[disabled]{background:var(--t);color:var(--h)}
</style>
<div class=pr><div class=hd id=hd></div>
<div class=r><span id=n1></span><b id=gv></b></div>
<div class=r><span id=n2></span><b id=fe></b></div>
<hr><div class="r t"><span id=n3></span><b id=gt></b></div></div>
<div id=tr><div id=pz></div><div id=lk></div><div id=fl></div><div id=th></div></div>
<div class=sc><span id=s0></span><span id=pl></span><span id=s1></span></div>
<button id=cp></button>
<script>
const W=window.TelegramWidget||{},H=W.HapticFeedback,$=s=>document.getElementById(s);
let D=null,d=0,i=-1,R=null,cpT=0;
const c=s=>Math.round(parseFloat(s)*100),m=v=>(v/100).toFixed(2);
const cmd=(w,a)=>w=='CryptoBot'?'@send '+a+'usdt':'@xrocket '+a;
const pos=j=>j/(D.a.length-1)*100;
function load(){try{D=JSON.parse(W.chatData)}catch(e){}if(!D)return;if(i<0){i=Math.max(0,D.a.indexOf(100));d=D.f|0}draw()}
function draw(){if(!D)return;const r=D.d[d],a=D.a[i],lk=a>D.l,pr=r[4]&&a<=r[4],rate=pr?r[2]:r[4]?r[3]:r[2],n=D.a.length;
 $('hd').textContent=lk?'Первые обмены — до '+D.l+' USDT':'Ваша сумма · можно от '+D.a[0]+' до '+(D.l<D.a[n-1]?D.l:D.a[n-1])+' USDT';
 $('n1').textContent='Ваш чек '+r[0];$('gv').textContent=m(c(a));
 const f=$('n2');f.textContent='Комиссия '+(pr?'🔥 ':'')+rate;f.className=pr?'fi':'';
 $('fe').textContent=lk?'—':m(c(a)-c(r[5][i]));$('n3').textContent='Чек '+r[1];$('gt').textContent=lk?'—':r[5][i];
 const p=pos(i);$('fl').style.width=p+'%';$('th').style.left=p+'%';
 const zi=r[4]?D.a.filter(v=>v<=r[4]).length-1:-1,li=D.a.findIndex(v=>v>D.l);
 $('pz').style.width=zi>0?Math.min(pos(zi),li>=0?pos(li-.5):100)+'%':'0';$('pl').textContent=zi>0?'🔥 выгодно до '+r[4]:'';
 $('lk').hidden=li<0;if(li>=0)$('lk').style.left=pos(li-.5)+'%';
 $('s0').textContent=D.a[0];$('s1').textContent=D.a[n-1];
 const b=$('cp');b.disabled=lk;if(!cpT)b.textContent=lk?'Пока до '+D.l+' USDT':'Скопировать  '+cmd(r[0],a)}
function at(e){const k=Math.max(0,Math.min(D.a.length-1,Math.round((e.clientX-R.left)/R.width*(D.a.length-1))));if(k!=i){i=k;H?.selectionChanged();draw()}}
const tr=$('tr');
tr.onpointerdown=e=>{if(!D)return;R=tr.getBoundingClientRect();tr.setPointerCapture(e.pointerId);at(e)};
tr.onpointermove=e=>{if(R&&tr.hasPointerCapture(e.pointerId))at(e)};
tr.onpointerup=tr.onpointercancel=()=>R=null;
$('cp').onclick=()=>{if(!D||$('cp').disabled)return;const r=D.d[d];W.copyText?.(cmd(r[0],D.a[i]));$('cp').textContent='Скопировано — вставьте в любой чат';clearTimeout(cpT);cpT=setTimeout(()=>{cpT=0;draw()},2500)};
W.onEvent?.('chatDataChanged',load);
load();
</script>
