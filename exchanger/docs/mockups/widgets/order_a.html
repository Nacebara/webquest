<style>
:root{color-scheme:light dark;--ok:light-dark(#1f9d55,#3fca74);--wa:light-dark(#d98200,#f2a93b);--h:var(--tg-theme-hint-color,#8a96a3);--a:var(--tg-theme-button-color,#3390ec);--ln:light-dark(#dde3e9,#33414f);--tx:var(--tg-theme-text-color,#000)}
body{margin:0;padding:10px 12px max(8px,var(--tg-content-safe-area-inset-bottom,0px));font-variant-numeric:tabular-nums}
.br{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.br i{position:relative;height:6px;border-radius:3px;background:var(--ln);overflow:hidden;transition:background .4s}
.br i.d{background:var(--ok)}
.br i.n{background:light-dark(#d3e5fb,#294560)}
.br i.n:after{content:"";position:absolute;top:0;bottom:0;left:0;width:45%;border-radius:3px;background:var(--a);animation:m 1.3s ease-in-out infinite}
.br i.s{background:var(--wa)}.br i.s:after{display:none}
@keyframes m{from{transform:translateX(-100%)}to{transform:translateX(230%)}}
.ln{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:8px;font-size:.86em;color:var(--h)}
.ln .w{color:var(--wa)}.ln .o{color:var(--ok)}
#dt{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:.88em;max-height:0;overflow:hidden;transition:max-height .3s,margin .3s}
#dt.on{max-height:130px;margin-top:10px}
#dt span{color:var(--h)}#dt b{font-weight:500;text-align:right}
button{all:unset;cursor:pointer;color:var(--tg-theme-link-color,#3390ec)}
button:active{opacity:.6}
#tg{display:inline-block;margin-top:8px;font-size:.86em;padding:2px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<div class=br id=br><i></i><i></i><i></i><i></i></div>
<div class=ln><span id=sl></span><span id=tm></span></div>
<div id=dt><span>Отдали</span><b id=di></b><span>Комиссия</span><b id=df></b><span>Получите</span><b id=do></b><span>Заявка</span><b><button id=id></button></b></div>
<button id=tg>Детали ▾</button>
<script>
const W=window.TelegramWidget||{},$=s=>document.getElementById(s);
let D=null,tk=0,op=0;
const pl=(n,f)=>{n%=100;const m=n%10;return f[n>10&&n<20?2:m==1?0:m>1&&m<5?1:2]};
const du=s=>s<60?s+' '+pl(s,['секунду','секунды','секунд']):Math.floor(s/60)+' мин '+s%60+' с';
const now=()=>Math.floor(Date.now()/1e3);
function tick(){if(!D)return;const t=Math.max(0,(D.t1||now())-D.t0);$('tm').textContent=D.t1?'':Math.floor(t/60)+':'+String(t%60).padStart(2,'0');if(D.st=='done')$('sl').textContent='Готово за '+du(t)}
function draw(){let x=null;try{x=JSON.parse(W.chatData)}catch(e){}
 const was=D&&D.st;D=x;if(!D)return;const st=D.st,k={check:0,send:2,slow:2,done:4,manual:D.k|0}[st]??0;
 [...$('br').children].forEach((b,j)=>b.className=j<k?'d':j==k?(st=='slow'||st=='manual'?'s':'n'):'');
 const sl=$('sl');sl.className=st=='slow'||st=='manual'?'w':st=='done'?'o':'';
 sl.textContent={check:'Проверяю чек · 1 из 4',send:'Создаю чек '+D.dst+' · 3 из 4',slow:'Дольше обычного — деньги у меня',manual:'Проверяю вручную · обычно до 15 минут'}[st]||'';
 $('di').textContent=D.in+' '+D.src;$('df').textContent=D.fee+' · '+D.pct;$('do').textContent=D.out+' '+D.dst;$('id').textContent=D.id+' ⧉';
 tick();clearInterval(tk);if(!D.t1)tk=setInterval(tick,1e3);
 if(st=='done'&&was&&was!='done')W.HapticFeedback?.notificationOccurred('success')}
function fold(v){op=v;$('dt').className=op?'on':'';$('tg').textContent=op?'Скрыть ▴':'Детали ▾';try{localStorage.setItem('o',op?'1':'')}catch(e){}}
$('tg').onclick=()=>fold(!op);
$('id').onclick=()=>D&&W.copyText?.(D.id);
W.onEvent?.('chatDataChanged',draw);
try{op=!!localStorage.getItem('o')}catch(e){}
fold(op);draw();
</script>
