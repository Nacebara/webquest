<style>
:root{color-scheme:light dark;--ok:light-dark(#1f9d55,#3fca74);--wa:light-dark(#d98200,#f2a93b);--fi:light-dark(#e8590c,#ff8a3d);--h:var(--tg-theme-hint-color,#8a96a3);--t:var(--tg-theme-secondary-bg-color,#eef1f4);--a:var(--tg-theme-button-color,#3390ec);--at:var(--tg-theme-button-text-color,#fff);--ln:light-dark(#d9dfe5,#36434f);--bg:var(--tg-theme-bg-color,#fff)}
body{margin:0;padding:8px 10px max(10px,var(--tg-content-safe-area-inset-bottom,0px));font-variant-numeric:tabular-nums}
button{all:unset;box-sizing:border-box;cursor:pointer}
.tb{font-size:.86em}
.tr{display:grid;grid-template-columns:12px 1fr auto 52px;gap:8px;align-items:center;width:100%;padding:7px 8px;border-radius:9px}
.tr+.tr{margin-top:1px}
.tr i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.tr i.w{background:var(--wa)}
.tr em{font-style:normal;text-align:right}
.tr em s{color:var(--h);font-size:.85em;margin-left:3px}
.tr .f{color:var(--fi);font-weight:600}
.tr u{text-decoration:none;text-align:right;color:var(--h)}
button.tr.on{background:var(--t);box-shadow:inset 3px 0 var(--a)}
.tr.x{color:var(--h)}
.am{display:flex;justify-content:space-between;align-items:baseline;margin:10px 4px 0}
.am small{color:var(--h);font-size:.76em;margin-right:4px}
.am b{font-size:1.15em}.am .g{color:var(--ok)}
#tk{position:relative;height:36px;margin:2px 13px 0;touch-action:pan-y}
#tk:before{content:"";position:absolute;left:0;right:0;top:16px;height:4px;border-radius:2px;background:var(--ln)}
#pz{position:absolute;left:0;top:16px;height:4px;border-radius:2px;background:light-dark(#ffd8bf,#5a3420)}
#lk{position:absolute;right:0;top:13px;height:10px;border-radius:5px;border:1px dashed var(--h);box-sizing:border-box}
#fl{position:absolute;left:0;top:16px;height:4px;border-radius:2px;background:var(--a)}
#th{position:absolute;top:5px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:light-dark(#fff,#eef2f6);box-shadow:0 1px 4px rgba(0,0,0,.3)}
#cp{display:block;width:100%;padding:10px;margin-top:6px;border-radius:10px;background:var(--a);color:var(--at);font-weight:600;font-size:.92em;text-align:center}
#cp[disabled]{background:var(--t);color:var(--h)}
.ft{margin:8px 2px 0;font-size:.76em;color:var(--h)}
</style>
<div class=tb id=tb></div>
<div class=am><span><small>Отдаёте</small><b id=gv></b></span><span><small>Получите</small><b id=gt class=g></b></span></div>
<div id=tk><div id=pz></div><div id=lk></div><div id=fl></div><div id=th></div></div>
<button id=cp></button>
<div class=ft id=ft></div>
<script>
const W=window.TelegramWidget||{},H=W.HapticFeedback,$=s=>document.getElementById(s);
let D=null,d=0,i=-1,R=null,cpT=0;
const c=s=>Math.round(parseFloat(s)*100),m=v=>(v/100).toFixed(2);
const cmd=(w,a)=>w=='CryptoBot'?'@send '+a+'usdt':'@xrocket '+a;
const pos=j=>j/(D.a.length-1)*100;
function load(){try{D=JSON.parse(W.chatData)}catch(e){}if(!D)return;if(i<0){i=Math.max(0,D.a.indexOf(100));d=D.f|0}draw()}
function draw(){if(!D)return;const n=D.a.length,r=D.d[d],a=D.a[i],lk=a>D.l,rg=D.a[0]+'–'+D.a[n-1];
 $('tb').innerHTML=D.d.map((x,j)=>'<button class="tr'+(j==d?' on':'')+'" data-j='+j+'><i></i><span>'+x[0]+' → '+x[1]+'</span><em>'+(x[4]?'<span class=f>🔥 '+x[2]+'</span><s>'+x[3]+'</s>':x[2])+'</em><u>'+rg+'</u></button>').join('')
  +D.i.map(x=>'<div class="tr x"><i class="'+(x[3]?'':'w')+'"></i><span>'+x[0]+'</span><em>'+x[1]+'</em><u>'+x[2]+'</u></div>').join('');
 $('gv').textContent=a+' USDT';$('gt').textContent=lk?'—':r[5][i]+' USDT';
 const p=pos(i);$('fl').style.width=p+'%';$('th').style.left=p+'%';
 const zi=r[4]?D.a.filter(v=>v<=r[4]).length-1:-1,li=D.a.findIndex(v=>v>D.l);
 $('pz').style.width=zi>0?Math.min(pos(zi),li>=0?pos(li-.5):100)+'%':'0';$('lk').hidden=li<0;if(li>=0)$('lk').style.left=pos(li-.5)+'%';
 const pr=r[4]&&a<=r[4];
 $('ft').textContent=(r[4]?(pr?'🔥 Выгодно на чек до '+r[4]+' USDT. ':'Выше '+r[4]+' USDT — обычная ставка '+r[3]+'. '):'')+'Комиссия не меньше '+D.m+' USDT'+(D.l<D.a[n-1]?' · первые обмены до '+D.l+' USDT':'')+' · курс на '+D.u;
 const b=$('cp');b.disabled=lk;if(!cpT)b.textContent=lk?'Пока до '+D.l+' USDT':'Скопировать  '+cmd(r[0],a)}
function at(e){const k=Math.max(0,Math.min(D.a.length-1,Math.round((e.clientX-R.left)/R.width*(D.a.length-1))));if(k!=i){i=k;H?.selectionChanged();draw()}}
const tk=$('tk');
tk.onpointerdown=e=>{if(!D)return;R=tk.getBoundingClientRect();tk.setPointerCapture(e.pointerId);at(e)};
tk.onpointermove=e=>{if(R&&tk.hasPointerCapture(e.pointerId))at(e)};
tk.onpointerup=tk.onpointercancel=()=>R=null;
$('tb').onclick=e=>{const j=e.target.closest('button')?.dataset.j;if(j!=null&&+j!=d){d=+j;H?.selectionChanged();draw()}};
$('cp').onclick=()=>{if(!D||$('cp').disabled)return;const r=D.d[d];W.copyText?.(cmd(r[0],D.a[i]));$('cp').textContent='Скопировано — вставьте в любой чат';clearTimeout(cpT);cpT=setTimeout(()=>{cpT=0;draw()},2500)};
W.onEvent?.('chatDataChanged',load);
load();
</script>
