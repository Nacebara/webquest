<title>Макеты exch</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Макет: стенд из телефонов. Страница — тихая рамка (тушь и мята из палитры эмодзи), всё внимание — чатам. */
:root {
  --bg: #F2F4F7; --surface: #FFFFFF; --fg: #131A2A; --muted: #5E6D7F; --line: #DCE2EA;
  --accent: #0F9463; --accent-ink: #FFFFFF; --chip: #E6EBF1;
  --display: "Unbounded", "Onest", system-ui, sans-serif;
  --body: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --tg-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  /* Telegram, светлая тема */
  --tg-bg: #CFDDE7; --tg-head: #FFFFFF; --tg-head-fg: #0F1419; --tg-head-mut: #7D8B99;
  --tg-in: #FFFFFF; --tg-out: #E3F7D2; --tg-fg: #0F1419; --tg-mut: #7D8B99; --tg-link: #1B7FCC;
  --tg-quote: rgba(27,127,204,.08); --tg-code: #B5473A; --tg-line: rgba(15,20,25,.12);
  --tg-btn: rgba(32,58,84,.34); --tg-btn-fg: #FFFFFF;
  --tg-kb: #F1F3F5; --tg-key: #FFFFFF; --tg-key-fg: #0F1419; --tg-input: #FFFFFF;
  --tg-primary: #3A86F0; --tg-success: #2FA34F; --tg-danger: #E0483F;
  --tg-chip: rgba(32,58,84,.28); --tg-mark: rgba(255,196,0,.35);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0F17; --surface: #111925; --fg: #E7ECF3; --muted: #8E9BAD; --line: #1E2938;
    --accent: #2BC48A; --accent-ink: #07130E; --chip: #18222F;
    --tg-bg: #0E1621; --tg-head: #17212B; --tg-head-fg: #F5F5F5; --tg-head-mut: #7F91A4;
    --tg-in: #182533; --tg-out: #2B5278; --tg-fg: #F5F5F5; --tg-mut: #7F91A4; --tg-link: #6AB3F3;
    --tg-quote: rgba(106,179,243,.10); --tg-code: #F0A58A; --tg-line: rgba(255,255,255,.10);
    --tg-btn: rgba(255,255,255,.09); --tg-btn-fg: #FFFFFF;
    --tg-kb: #17212B; --tg-key: #232E3C; --tg-key-fg: #F5F5F5; --tg-input: #17212B;
    --tg-chip: rgba(0,0,0,.35); --tg-mark: rgba(255,196,0,.28);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0F17; --surface: #111925; --fg: #E7ECF3; --muted: #8E9BAD; --line: #1E2938;
  --accent: #2BC48A; --accent-ink: #07130E; --chip: #18222F;
  --tg-bg: #0E1621; --tg-head: #17212B; --tg-head-fg: #F5F5F5; --tg-head-mut: #7F91A4;
  --tg-in: #182533; --tg-out: #2B5278; --tg-fg: #F5F5F5; --tg-mut: #7F91A4; --tg-link: #6AB3F3;
  --tg-quote: rgba(106,179,243,.10); --tg-code: #F0A58A; --tg-line: rgba(255,255,255,.10);
  --tg-btn: rgba(255,255,255,.09); --tg-btn-fg: #FFFFFF;
  --tg-kb: #17212B; --tg-key: #232E3C; --tg-key-fg: #F5F5F5; --tg-input: #17212B;
  --tg-chip: rgba(0,0,0,.35); --tg-mark: rgba(255,196,0,.28);
  color-scheme: dark;
}
/* Переключатель темы чатов: перекрывает токены Telegram только внутри стенда. */
.stage[data-tg="light"] {
  --tg-bg: #CFDDE7; --tg-head: #FFFFFF; --tg-head-fg: #0F1419; --tg-head-mut: #7D8B99;
  --tg-in: #FFFFFF; --tg-out: #E3F7D2; --tg-fg: #0F1419; --tg-mut: #7D8B99; --tg-link: #1B7FCC;
  --tg-quote: rgba(27,127,204,.08); --tg-code: #B5473A; --tg-line: rgba(15,20,25,.12);
  --tg-btn: rgba(32,58,84,.34); --tg-kb: #F1F3F5; --tg-key: #FFFFFF; --tg-key-fg: #0F1419; --tg-input: #FFFFFF;
  --tg-chip: rgba(32,58,84,.28); --tg-mark: rgba(255,196,0,.35);
}
.stage[data-tg="dark"] {
  --tg-bg: #0E1621; --tg-head: #17212B; --tg-head-fg: #F5F5F5; --tg-head-mut: #7F91A4;
  --tg-in: #182533; --tg-out: #2B5278; --tg-fg: #F5F5F5; --tg-mut: #7F91A4; --tg-link: #6AB3F3;
  --tg-quote: rgba(106,179,243,.10); --tg-code: #F0A58A; --tg-line: rgba(255,255,255,.10);
  --tg-btn: rgba(255,255,255,.09); --tg-kb: #17212B; --tg-key: #232E3C; --tg-key-fg: #F5F5F5; --tg-input: #17212B;
  --tg-chip: rgba(0,0,0,.35); --tg-mark: rgba(255,196,0,.28);
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; }
header.top { display: grid; gap: 14px; padding-block: 8px 18px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand .ce { width: 40px; height: 40px; }
h1 { font: 700 clamp(26px, 4vw, 40px)/1.05 var(--display); letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.lead { color: var(--muted); max-width: 68ch; margin: 0; }
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-block: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.tab { font: 600 14px/1 var(--body); padding: 10px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; display: inline-flex; gap: 8px; align-items: center; text-decoration: none; }
.tab[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.tab:focus-visible, button:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tab .n { font: 500 12px/1 var(--mono); opacity: .7; }
.spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.seg button { font: 500 13px/1 var(--body); padding: 9px 12px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--chip); color: var(--fg); }
section.view { display: grid; gap: 34px; padding-top: 26px; }
.block { display: grid; gap: 16px; }
.block > header { display: grid; gap: 6px; max-width: 76ch; }
h2 { font: 700 22px/1.15 var(--display); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
h2 small { font: 500 13px/1 var(--mono); color: var(--muted); letter-spacing: 0; margin-left: 8px; vertical-align: 3px; }
.block > header p { margin: 0; color: var(--muted); }
.grid { display: grid; gap: 22px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); align-items: start; }
.grid.wide { grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); }
figure.card { margin: 0; display: grid; gap: 10px; min-width: 0; }
figcaption { display: grid; gap: 3px; padding-inline: 4px; }
figcaption b { font: 600 15px/1.3 var(--body); }
figcaption span { color: var(--muted); font-size: 13.5px; }
.tag { font: 600 10.5px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; justify-self: start; }
.dir { display: grid; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; min-width: 0; }
.dir.pick { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.dir h3 { margin: 0; font: 700 17px/1.2 var(--display); display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.dir h3 .badge { font: 600 11px/1 var(--body); color: var(--accent-ink); background: var(--accent); border-radius: 999px; padding: 5px 8px; }
.dir p { margin: 0; color: var(--muted); font-size: 14px; }
.dir ul { margin: 0; padding-left: 18px; font-size: 13.5px; color: var(--muted); display: grid; gap: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { font: 500 13px/1 var(--body); padding: 8px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip.play { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* ── Телефон ─────────────────────────────────────────── */
.phone { border-radius: 22px; overflow: hidden; background: var(--tg-bg); color: var(--tg-fg); font: 15px/1.38 var(--tg-font); border: 1px solid var(--line); box-shadow: 0 1px 0 rgba(0,0,0,.02), 0 12px 30px -18px rgba(10,20,40,.35); max-width: 420px; width: 100%; justify-self: center; display: flex; flex-direction: column; }
.ph-head { background: var(--tg-head); color: var(--tg-head-fg); display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--tg-line); }
.ph-head .back { color: var(--tg-link); font-size: 22px; line-height: 1; width: 14px; }
.av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; background: linear-gradient(135deg, #1DBB80, #0C8A5C); }
.av.ops { background: linear-gradient(135deg, #3A4470, #1E2440); }
.av { color: #fff; }
.av .ce { width: 22px; height: 22px; }
.ph-head .who { display: grid; line-height: 1.2; min-width: 0; }
.ph-head .who b { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ph-head .who small { color: var(--tg-head-mut); font-size: 13px; }
.ph-chat { padding: 12px 10px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.msg { display: flex; flex-direction: column; gap: 4px; max-width: 88%; align-self: flex-start; min-width: 0; }
.msg.user { align-self: flex-end; align-items: flex-end; }
.msg.rich { max-width: 96%; width: 96%; }
.msg.big { max-width: none; }
.bub { background: var(--tg-in); border-radius: 14px 14px 14px 5px; padding: 7px 10px 7px 11px; position: relative; overflow-wrap: anywhere; min-width: 0; box-shadow: 0 1px 1px rgba(0,0,0,.08); }
.msg.user .bub { background: var(--tg-out); border-radius: 14px 14px 5px 14px; }
.msg.big .bub { background: none; box-shadow: none; padding: 0; }
.msg.big .bub > .ce { width: 112px; height: 112px; }
.tm { float: right; font-size: 11.5px; color: var(--tg-mut); margin: 6px -2px -4px 10px; line-height: 1; white-space: nowrap; }
.msg.user .tm { color: color-mix(in srgb, var(--tg-mut) 70%, #3D9A3D); }
.via { color: var(--tg-link); font-weight: 600; font-size: 13.5px; margin-bottom: 1px; }
.msg:not(.rich) .bub { white-space: pre-wrap; }
.bub b { font-weight: 600; }
.bub i { font-style: italic; }
.bub code, .bub pre { font-family: var(--mono); font-size: 13.5px; color: var(--tg-code); }
.bub pre { margin: 6px 0 2px; padding: 8px 10px; background: var(--tg-quote); border-radius: 8px; white-space: pre-wrap; color: var(--tg-fg); font-size: 12.5px; line-height: 1.45; }
.bub a { color: var(--tg-link); text-decoration: none; }
.bub blockquote { margin: 6px 0 2px; padding: 5px 26px 5px 10px; border-left: 3px solid var(--tg-link); background: var(--tg-quote); border-radius: 4px 8px 8px 4px; position: relative; }
.bub blockquote.x::after { content: "⌄"; position: absolute; right: 8px; bottom: 4px; color: var(--tg-link); font-size: 14px; line-height: 1; }
.bub blockquote.x.closed { max-height: 3.1em; overflow: hidden; }
.bub mark { background: var(--tg-mark); color: inherit; border-radius: 3px; padding: 0 2px; }
.bub .sp { background: repeating-linear-gradient(45deg, var(--tg-mut) 0 2px, transparent 2px 4px); color: transparent; border-radius: 3px; }
.bub .line { display: block; }
.edited { font-style: normal; }
.kb { display: grid; gap: 4px; width: 100%; }
.kb .row { display: flex; gap: 4px; }
.btn { flex: 1 1 0; min-width: 0; background: var(--tg-btn); color: var(--tg-btn-fg); border-radius: 9px; padding: 9px 8px; font-size: 14px; font-weight: 500; text-align: center; display: flex; align-items: center; justify-content: center; gap: 6px; position: relative; backdrop-filter: blur(6px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.15; }
.btn span.t { overflow: hidden; text-overflow: ellipsis; }
.btn.primary { background: var(--tg-primary); }
.btn.success { background: var(--tg-success); }
.btn.danger { background: var(--tg-danger); }
.btn.off { opacity: .45; }
.btn .ce { width: 18px; height: 18px; flex: none; }
.btn.u::after { content: "↗"; position: absolute; top: 3px; right: 5px; font-size: 10px; opacity: .8; }
.btn.c::after { content: ""; position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border: 1.3px solid currentColor; border-radius: 2px; opacity: .7; }
.sys { align-self: center; background: var(--tg-chip); color: #fff; font-size: 13px; font-weight: 500; padding: 4px 10px; border-radius: 999px; }
.reply { background: var(--tg-kb); padding: 6px 6px 8px; display: grid; gap: 6px; border-top: 1px solid var(--tg-line); }
.reply .row { display: flex; gap: 6px; }
.key { flex: 1 1 0; min-width: 0; background: var(--tg-key); color: var(--tg-key-fg); border-radius: 8px; padding: 10px 6px; text-align: center; font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 1px 0 rgba(0,0,0,.12); white-space: nowrap; overflow: hidden; }
.key.primary { background: var(--tg-primary); color: #fff; }
.key .ce { width: 18px; height: 18px; flex: none; }
.inputbar { background: var(--tg-input); color: var(--tg-mut); padding: 11px 14px; font-size: 14.5px; border-top: 1px solid var(--tg-line); display: flex; justify-content: space-between; gap: 8px; }
.inputbar.typed { color: var(--tg-fg); }
.file { display: flex; gap: 10px; align-items: center; }
.file .ico { width: 42px; height: 42px; border-radius: 50%; background: var(--tg-link); display: grid; place-items: center; flex: none; }
.file .ico { color: #fff; }
.file .ico .ce { width: 22px; height: 22px; }
.file small { color: var(--tg-mut); display: block; font-size: 12.5px; }

/* rich-сообщение (Bot API 10.3) */
.rich .bub { padding: 10px 12px 9px; }
.rich h3 { font-size: 17px; font-weight: 700; margin: 0 0 6px; line-height: 1.25; display: flex; align-items: center; gap: 6px; }
.rich h3 .ce { width: 24px; height: 24px; }
.rich h4 { font-size: 14px; font-weight: 600; margin: 10px 0 4px; color: var(--tg-mut); }
.rich p { margin: 0 0 6px; }
.rich table { width: 100%; border-collapse: collapse; font-size: 13.5px; margin: 4px 0 8px; font-variant-numeric: tabular-nums; }
.rich th { text-align: left; font-weight: 600; color: var(--tg-mut); font-size: 12px; padding: 4px 6px; border-bottom: 1px solid var(--tg-line); }
.rich td { padding: 5px 6px; border-bottom: 1px solid var(--tg-line); vertical-align: top; }
.rich tr:nth-child(even) td { background: color-mix(in srgb, var(--tg-quote) 60%, transparent); }
.rich td.r, .rich th.r { text-align: right; }
.rich .tw { overflow-x: auto; }
.rich details { border-top: 1px solid var(--tg-line); padding: 7px 0 1px; }
.rich details:last-of-type { border-bottom: 1px solid var(--tg-line); margin-bottom: 6px; }
.rich summary { cursor: pointer; font-weight: 600; font-size: 14px; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-bottom: 6px; }
.rich summary::-webkit-details-marker { display: none; }
.rich summary::after { content: "›"; color: var(--tg-mut); transform: rotate(90deg); transition: transform .15s; font-size: 18px; line-height: 1; }
.rich details[open] > summary::after { transform: rotate(-90deg); }
.rich footer { color: var(--tg-mut); font-size: 12.5px; margin-top: 6px; display: flex; gap: 6px; align-items: center; }
.rich hr { border: 0; border-top: 1px solid var(--tg-line); margin: 8px 0; }
.rich ul.tasks { list-style: none; padding: 0; margin: 4px 0 6px; display: grid; gap: 5px; }
.rich ul.tasks li { display: flex; gap: 8px; align-items: flex-start; }
.rich ul.tasks li .ce { flex: none; margin-top: 1px; }
.rich .rows { display: grid; gap: 5px; margin: 4px 0 8px; }
.rich .rows > div { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; }
.rich .rows small { color: var(--tg-mut); font-size: 12.5px; }
.rich .kpi { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 6px 0 8px; }
.rich .kpi > div { background: var(--tg-quote); border-radius: 10px; padding: 7px 8px; display: grid; gap: 1px; }
.rich .kpi small { color: var(--tg-mut); font-size: 11.5px; }
.rich .kpi b { font-size: 16px; font-variant-numeric: tabular-nums; }
.rich .kpi em { font-style: normal; font-size: 11.5px; }
.up { color: var(--tg-success); } .down { color: var(--tg-danger); }
.chart { width: 100%; height: auto; display: block; margin: 4px 0 6px; border-radius: 8px; background: var(--tg-quote); }
.mut { color: var(--tg-mut); }

/* эмодзи */
.ce { display: inline-block; width: 1.32em; height: 1.32em; vertical-align: -0.3em; line-height: 1; text-align: center; font-style: normal; }
.ce svg { display: block; }
.seg3 { white-space: nowrap; }
.seg3 .ce { margin-right: -0.06em; }

/* эмодзи-витрина */
.emoji-board { background: var(--tg-bg); color: var(--tg-fg); border-radius: 18px; padding: 18px; border: 1px solid var(--line); display: grid; gap: 14px; }
.egrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.etile { display: grid; justify-items: center; gap: 6px; padding: 12px 6px 10px; border-radius: 14px; background: color-mix(in srgb, var(--tg-in) 70%, transparent); text-align: center; }
.etile .ce { width: 56px; height: 56px; }
.etile b { font: 600 12.5px/1.2 var(--tg-font); }
.etile code { font: 500 11px/1 var(--mono); color: var(--tg-mut); }
.etile .an { font: 600 9.5px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--tg-success); }
.inline-demo { font: 15px/1.5 var(--tg-font); }

/* правила */
.rules { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.rule { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 6px; align-content: start; }
.rule b { font: 600 15.5px/1.3 var(--body); }
.rule p { margin: 0; color: var(--muted); font-size: 14px; }
.rule .k { font: 600 11px/1 var(--mono); color: var(--accent); letter-spacing: .05em; text-transform: uppercase; }
.map { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); }
.map a { display: grid; gap: 2px; padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); color: var(--fg); text-decoration: none; font-size: 14px; }
.map a small { color: var(--muted); font-size: 12.5px; }
.map a:hover { border-color: var(--accent); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
@media (max-width: 640px) { nav.tabs { position: static; } }
@media (max-width: 520px) { .rich .kpi { grid-template-columns: repeat(2, 1fr); } nav.tabs { gap: 6px; } .tab { padding: 9px 11px; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><i class="ce" data-k="color/swap">🔁</i><h1>Макеты exch</h1></div>
    <p class="lead">Клиентский бот и пульт для персонала. Эмодзи на странице — наши TGS: та же анимация, что покажет Telegram. Тексты укорочены: одна-две строки на шаг, детали спрятаны в раскрывающуюся цитату.</p>
  </header>
  <nav class="tabs" role="tablist" aria-label="Разделы">
    <a class="tab" role="tab" href="#client" data-view="client">Клиент <span class="n" id="n-client"></span></a>
    <a class="tab" role="tab" href="#admin" data-view="admin">Пульт <span class="n" id="n-admin"></span></a>
    <a class="tab" role="tab" href="#emoji" data-view="emoji">Эмодзи <span class="n" id="n-emoji"></span></a>

const FB = { done: '✅', err: '❌', warn: '⚠️', process: '🔄', wait: '⏳', swap: '🔁', sending: '📤', refund: '↩️', manual: '🔎', invoice: '🧾', usdt: '💲', fast: '⚡', alarm: '🚨', live: '🟢', confetti: '🎉', dot_ok: '🟢', dot_wait: '🟠', dot_act: '🔴', dot_work: '🔵', dot_closed: '⚪', step_done: '✅', step_now: '🔵', step_todo: '⚪', shield: '🛡', lock: '🔒', kill: '⛔', pause: '⏸', robot: '🤖', vault: '🏦', broadcast: '📣', history: '🕘', rates: '📈', support: '💬', ban: '🚫', limit: '📏', maint: '🛠', flood: '⌛', cb: '🔷', xr: '🚀' };

// ── эмодзи: lottie по требованию, моно перекрашиваем в цвет текста ─────────────
const io = new IntersectionObserver((entries) => {
  for (const en of entries) {
    const el = en.target;
    if (en.isIntersecting) { if (!el._a) mount(el); else if (el._live) el._a.play(); }
    else if (el._a && el._live) el._a.pause();
  }
}, { rootMargin: '160px' });
function rgbOf(el) {
  const m = getComputedStyle(el).color.match(/[\d.]+/g) || [255, 255, 255];
  return [+m[0] / 255, +m[1] / 255, +m[2] / 255, 1];
}
function recolor(o, c) {
  if (Array.isArray(o)) { for (const v of o) recolor(v, c); return; }
  if (o && typeof o === 'object') {
    if ((o.ty === 'fl' || o.ty === 'st') && o.c && o.c.a === 0) o.c.k = c;
    for (const k in o) if (o[k] && typeof o[k] === 'object') recolor(o[k], c);
  }
}
function mount(el) {
  if (!window.lottie || !EMOJI[el.dataset.k]) return;
  const data = JSON.parse(str(el.dataset.k));
  if (el.classList.contains('mono')) recolor(data, rgbOf(el));
  const animated = data.op - data.ip > 60;
  el.textContent = '';
  const a = lottie.loadAnimation({ container: el, renderer: 'svg', loop: true, autoplay: animated && !REDUCE, animationData: data });
  if (!animated || REDUCE) a.goToAndStop(0, true);
  el._a = a; el._live = animated && !REDUCE;
}
function observe(root) { root.querySelectorAll('.ce').forEach((el) => io.observe(el)); }
function release(root) { root.querySelectorAll('.ce').forEach((el) => { io.unobserve(el); if (el._a) el._a.destroy(); el._a = null; }); }
function remountMono() {
  document.querySelectorAll('.ce.mono').forEach((el) => { if (el._a) { el._a.destroy(); el._a = null; el.textContent = ''; mount(el); } });
}

// ── разметка сообщений ─────────────────────────────────────────────────────────

const SEGK = { m: 'seg_mint', b: 'seg_blue', a: 'seg_amber', c: 'seg_coral', e: 'seg_empty', n: 'seg_now' };
const ce = (k, mono) => `<i class="ce${mono ? ' mono' : ''}" data-k="${mono ? 'mono' : 'color'}/${k}" aria-hidden="true">${FB[k] || '·'}</i>`;
function fmt(s) {
  return s

    .replace(/\{(-?)([a-z_]+)\}/g, (_, m, k) => ce(k, !!m))
    .replace(/\n(?=<bqx?>)/g, '').replace(/(<\/bqx?>)\n/g, '$1')
    .replace(/<bq>/g, '<blockquote>').replace(/<\/bq>/g, '</blockquote>')
    .replace(/<bqx>/g, '<blockquote class="x closed">').replace(/<\/bqx>/g, '</blockquote>');
}
const B = (html, kb, o = {}) => ({ who: 'bot', html, kb, ...o });

// кнопка: 'текст' | ['текст', 'иконка', 'primary|success|danger|off', 'u|c']
function btn(b) {

  return `<span class="btn ${s || ''} ${kind || ''}">${i ? ce(i, true) : ''}<span class="t">${t}</span></span>`;
}
function msgHTML(m) {
  if (m.sys) return `<div class="sys">${m.sys}</div>`;
  const tm = `<span class="tm">${m.edited ? 'изменено ' : ''}${m.time || '14:05'}</span>`;

  return `<div class="msg ${m.who}${m.rich ? ' rich' : ''}"><div class="bub">${inner}</div>${kb}</div>`;
}
function phoneHTML(p) {

// ── график для статистики (SVG, токены темы) ───────────────────────────────────
function chartSVG(days) {
  // days: [подпись, оборот USDT, валовая прибыль USDT]. Слева оборот 0–15k, справа прибыль 0–300 (те же линии сетки).
  const W = 340, H = 140, L = 30, RP = 28, T = 10, BT = 22;
  const yl = (v) => T + (H - T - BT) * (1 - v / 15000);
  const yr = (v) => T + (H - T - BT) * (1 - v / 300);
  let g = '';
  for (const t of [0, 5000, 10000, 15000]) {
    g += `<line x1="${L}" x2="${W - RP}" y1="${yl(t)}" y2="${yl(t)}" stroke="var(--tg-line)"/>`;
    g += `<text x="${L - 5}" y="${yl(t) + 3.5}" text-anchor="end" font-size="9" fill="var(--tg-mut)">${t ? t / 1000 + 'k' : '0'}</text>`;
    g += `<text x="${W - RP + 5}" y="${yl(t) + 3.5}" font-size="9" fill="var(--tg-success)">${t / 50}</text>`;
  }
  const bw = (W - L - RP) / days.length;
  let bars = '';
  const pts = [];
  days.forEach(([d, turn, gross], i) => {
    const x = L + i * bw + bw * 0.2, w = bw * 0.6;
    bars += `<rect x="${x.toFixed(1)}" y="${yl(turn).toFixed(1)}" width="${w.toFixed(1)}" height="${(yl(0) - yl(turn)).toFixed(1)}" rx="3" fill="var(--tg-link)" opacity="${i === days.length - 1 ? 0.95 : 0.5}"/>`;
    bars += `<text x="${(x + w / 2).toFixed(1)}" y="${H - 7}" text-anchor="middle" font-size="9" fill="var(--tg-mut)">${d}</text>`;
    pts.push([x + w / 2, yr(gross)]);
  });
  const line = `<polyline points="${pts.map((p) => p.map((v) => v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="var(--tg-success)" stroke-width="2" stroke-linejoin="round"/>` +
    pts.map((p, i) => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i === pts.length - 1 ? 3.2 : 2}" fill="var(--tg-success)"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Оборот по дням и валовая прибыль">${g}${bars}${line}</svg><p class="mut" style="font-size:12px">Столбцы — оборот, USDT (слева) · линия — валовая прибыль (справа)</p>`;
}

function dirCard(d) {
  const names = Object.keys(d.states);
  return `<div class="dir${d.pick ? ' pick' : ''}" data-dir="${d.id}"><h3>${d.id}. ${d.name}${d.pick ? '<span class="badge">рекомендую</span>' : ''}</h3><p>${d.idea}</p><div class="chips" role="group" aria-label="Шаг заявки">${names.map((s, i) => `<button type="button" class="chip" id="dir-${d.id}-${i}" data-state="${s}" aria-pressed="${i === names.length - 1}">${s}</button>`).join('')}<button type="button" class="chip play" id="dir-${d.id}-play" data-play="1">▶ Проиграть</button></div><div class="slot">${phoneHTML({ m: d.states[names[names.length - 1]], noinput: true })}</div><ul>${d.plus.map((x) => `<li>${x}</li>`).join('')}${d.minus.map((x) => `<li>− ${x}</li>`).join('')}</ul></div>`;
}
function renderClient() {
  const v = document.getElementById('view-client');
  v.innerHTML = `<div class="block"><header><h2>Четыре направления<small>A–D</small></h2><p>Один и тот же обмен — чек CryptoBot на 100 USDT → чек xRocket. Переключайте шаги или нажмите «Проиграть»: в боте это одно сообщение, которое правится.</p></header><div class="grid wide">${DIRS.map(dirCard).join('')}</div></div>` +
    block('Путь клиента в варианте A', FLOW.length + ' экранов', 'Денежный поток — обычные HTML-сообщения: показываются в любом клиенте. Справка (приветствие, курс, история) — rich, у каждого есть простой вариант.', FLOW);
  v.querySelectorAll('.dir').forEach((el) => {
    const d = DIRS.find((x) => x.id === el.dataset.dir);
    const slot = el.querySelector('.slot');
    const names = Object.keys(d.states);
    const show = (s) => {
      release(slot); slot.innerHTML = phoneHTML({ m: d.states[s], noinput: true }); observe(slot);
      el.querySelectorAll('[data-state]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.state === s)));
    };
    el.addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.state) { clearInterval(el._t); show(b.dataset.state); }
      if (b.dataset.play) {
        clearInterval(el._t); let i = 0; show(names[0]);
        el._t = setInterval(() => { i += 1; if (i >= names.length) { clearInterval(el._t); return; } show(names[i]); }, 2200);
      }
    });
  });
}

    ['Пульт', 'Необратимое — дважды', 'Предпросмотр «что произойдёт» и одноразовая кнопка на 60 секунд. Для пяти самых опасных действий нужно ещё ввести контрольную строку.'],
    ['Пульт', 'Алерт правится, а не множится', 'Повтор того же события правит старое сообщение («×7, последнее 14:05»). После «Принял» алерт перестаёт повторяться.'],
    ['Пульт', 'Деньги только из леджера', 'Статистика, резервы и сверка считаются из проводок, а не из полей заявки. Цифры везде совпадают.'],
  ];
  v.innerHTML = `<div class="block"><header><h2>Правила интерфейса<small>${R.length}</small></h2><p>По ним собраны все макеты. Когда выберете варианты, перенесу их в экраны ui и в пульт.</p></header><div class="rules">${R.map(([k, b, p]) => `<div class="rule"><span class="k">${k}</span><b>${b}</b><p>${p}</p></div>`).join('')}</div></div>`;
}

// ── вкладки и тема чатов ───────────────────────────────────────────────────────
const VIEWS = ['client', 'admin', 'emoji', 'rules'];
const rendered = {};
const RENDER = { client: renderClient, admin: renderAdmin, emoji: renderEmoji, rules: renderRules };
function show(name) {
  if (!VIEWS.includes(name)) name = 'client';
  for (const v of VIEWS) {
    const el = document.getElementById('view-' + v);
    if (v === name && !rendered[v]) { RENDER[v](); rendered[v] = true; observe(el); }
    el.hidden = v !== name;
  }
  document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', String(t.dataset.view === name)));
}
window.addEventListener('hashchange', () => show(location.hash.slice(1)));
document.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => {
  const stage = document.getElementById('stage');
  if (b.dataset.tg === 'auto') delete stage.dataset.tg; else stage.dataset.tg = b.dataset.tg;
  document.querySelectorAll('.seg button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  try { localStorage.setItem('exch-tg', b.dataset.tg); } catch (e) { /* без памяти — не страшно */ }
  remountMono();
}));
try { const saved = localStorage.getItem('exch-tg'); if (saved && saved !== 'auto') document.getElementById('tg-' + saved)?.click(); } catch (e) { /* нет хранилища */ }
document.getElementById('n-client').textContent = `${DIRS.length} + ${FLOW.length}`;
document.getElementById('n-admin').textContent = `${DASH.length} + ${ADMIN.reduce((n, g) => n + g.items.length, 0)}`;
document.getElementById('n-emoji').textContent = Object.keys(EMOJI).length;
observe(document.querySelector('header.top'));
show(location.hash.slice(1) || 'client');
</script>
