name: exchanger-ci

# Бот-обменник (каталог exchanger/): fmt, clippy, офлайн-данные sqlx, тесты на PostgreSQL 16.
on:
  push:
    paths:
      - "exchanger/**"
      - ".github/workflows/exchanger-ci.yml"
  pull_request:
    paths:
      - "exchanger/**"
      - ".github/workflows/exchanger-ci.yml"

concurrency:
  group: exchanger-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: exchanger

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://postgres:dev@localhost:5432/exch
  SQLX_CLI_VERSION: 0.9.0

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: exchanger
          cache-bin: true

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy (offline sqlx data)
        env:
          SQLX_OFFLINE: "true"
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Install sqlx-cli
        run: |
          if ! sqlx --version 2>/dev/null | grep -q "$SQLX_CLI_VERSION"; then
            cargo install sqlx-cli --version "$SQLX_CLI_VERSION" --locked --no-default-features --features postgres,rustls
          fi

      - name: schema.sql applies standalone in one transaction
        env:
          PGPASSWORD: dev
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -qc "CREATE DATABASE schema_check"
          psql -h localhost -U postgres -d schema_check -v ON_ERROR_STOP=1 -q -1 -f schema.sql

      - name: Apply migrations
        run: |
          sqlx database create
          sqlx migrate run --source migrations

      - name: sqlx offline data is up to date
        run: cargo sqlx prepare --workspace --check -- --all-targets

      - name: cargo test
        run: cargo test --workspace --all-features

  # Владелец запускает exch на Windows, а код под cfg(windows) (сигналы остановки, служба) на
  # Linux не компилируется. Кросс-проверка ловит его ошибки до живого прогона (шаг 2.1).
  windows-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and the Windows target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-pc-windows-gnu
          sudo apt-get install -y -q gcc-mingw-w64-x86-64

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: exchanger
          key: windows-gnu

      - name: cargo clippy for Windows
        run: cargo clippy --workspace --all-targets --all-features --target x86_64-pc-windows-gnu -- -D warnings

  # Шаг 3.3 плана: настоящая сборка exch.exe на Windows (владелец запускает бот там, рядом с
  # гарантом) — то же, что соберёт он сам; готовый файл — артефакт запуска CI.
  windows-build:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: exchanger
          key: windows-msvc

      - name: cargo build --release
        run: cargo build --release --bin exch

      - name: exch --help (бинарник запускается)
        run: target/release/exch.exe --help

      # Веха 10: служба Windows регистрируется как задумано — автозапуск (отложенный), зависимость
      # от PostgreSQL, перезапуск при сбое, запуск с полным путём к .env; удаляется без следов.
      - name: Служба Windows — установка, проверка, удаление
        shell: pwsh
        run: |
          New-Item -ItemType File -Force -Path .env | Out-Null
          $pg = (Get-Service -Name "postgresql*" -ErrorAction SilentlyContinue | Select-Object -First 1).Name
          if (-not $pg) { $pg = "Dnscache" }
          target/release/exch.exe service install --postgres $pg
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $qc = sc.exe qc exch | Out-String
          Write-Output $qc
          if ($qc -notmatch "AUTO_START" -or $qc -notmatch [regex]::Escape($pg) -or $qc -notmatch "service-run" -or $qc -notmatch "\.env") { Write-Error "unexpected service config"; exit 1 }
          $fail = sc.exe qfailure exch | Out-String
          Write-Output $fail
          if ($fail -notmatch "RESTART") { Write-Error "no restart on failure"; exit 1 }
          target/release/exch.exe service status
          target/release/exch.exe service uninstall
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $left = target/release/exch.exe service status | Out-String
          if ($left -notmatch "не установлена") { Write-Error "service still registered"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: exch-windows
          path: exchanger/target/release/exch.exe
          retention-days: 14

  # Шаг 3.3 плана: известные уязвимости зависимостей. Исключения — с причиной в
  # exchanger/.cargo/audit.toml.
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        run: cargo audit
